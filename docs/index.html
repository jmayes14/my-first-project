<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Placeholder page for my-first-project. Coming soon."
    />
    <title>my-first-project</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #111827;
        --muted: #4b5563;
        --border: #dbe3ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(92vw, 42rem);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 2rem 1.5rem;
        box-shadow: 0 6px 18px rgba(17, 24, 39, 0.06);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>my-first-project</h1>
      <p>Coming soon.</p>
    </main>
  </body>
</html>
